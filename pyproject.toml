[project]
name = "zotero-mcp"
version = "0.2.6"
description = "Zotero CLI and MCP server for local and Web API operations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.16.0"
]

[project.scripts]
zotero-mcp = "zotero_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zotero_mcp"]
