[project]
name = "zotero-mcp"
version = "0.3.0"
description = "Local-first Zotero MCP server using the official Zotero 10+ Local API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.16.0,<2"
]

[project.scripts]
zotero-mcp = "zotero_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zotero_mcp"]
